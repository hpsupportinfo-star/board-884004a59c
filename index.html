<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仕入れ利益率ダッシュボード</title>
<style>
:root{--bg:#f4f5f2;--fg:#1c1d1b;--muted:#676a64;--card:#ffffff;--line:#e1e3de;--soft:#f7f8f5;--zebra:#fafbf9;--brand:#17734a;--brandbg:#e6f1eb;--good:#17734a;--goodbg:rgba(23,115,74,.13);--mid:#8f6400;--midbg:rgba(143,100,0,.13);--low:#7d807a;--lowbg:rgba(125,128,122,.13);--chip:#dfe2dc;--on:#17734a;--ontxt:#ffffff;--hl:rgba(23,115,74,.08);--ng:#b3261e}
@media (prefers-color-scheme: dark){:root{--bg:#141513;--fg:#ecede8;--muted:#9a9d95;--card:#1e1f1d;--line:#33352f;--soft:#232422;--zebra:#222321;--brand:#52c78f;--brandbg:rgba(82,199,143,.14);--good:#52c78f;--goodbg:rgba(82,199,143,.16);--mid:#e3b553;--midbg:rgba(227,181,83,.16);--low:#8f928b;--lowbg:rgba(143,146,139,.16);--chip:#3a3c37;--on:#52c78f;--ontxt:#0f1a14;--hl:rgba(82,199,143,.10);--ng:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
.pd{color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding:0 max(14px,env(safe-area-inset-left,0px)) 48px max(14px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto;line-height:1.5}
.pd button{font:inherit;color:inherit;cursor:pointer}
.pd button:focus-visible,.pd select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pd header{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.pd .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--ontxt);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.pd header h1{font-size:19px;margin:0;line-height:1.3}
.pd header p{margin:0;color:var(--muted);font-size:12px}
.pd .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.pd .kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.pd .kpi small{display:block;color:var(--muted);font-size:11px}
.pd .kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.pd .kpi span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .kpi .g b{color:var(--good)}
.pd .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.pd .step{padding:12px 0;border-top:1px solid var(--line)}
.pd .step:first-child{padding-top:0;border-top:0}
.pd .step:last-child{padding-bottom:0}
.pd .st{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:0 0 8px;font-size:13px;font-weight:700}
.pd .st em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.pd .search{position:relative}
.pd .search input{width:100%;font:inherit;font-size:16px;padding:12px 44px;border:2px solid var(--brand);border-radius:12px;background:var(--card);color:var(--fg)}
.pd .search input:focus{outline:none;box-shadow:0 0 0 3px var(--brandbg)}
.pd .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--brand)}
.pd .search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:6px 10px}
.pd .words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pd .words small{color:var(--muted);font-size:11px;margin-right:2px}
.pd .word{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 12px;font-size:12px}
.pd .word[aria-pressed="true"]{background:var(--on);color:var(--ontxt);border-color:var(--on);font-weight:700}
.pd .cats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pd .cat{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600}
.pd .cat svg{color:var(--brand)}
.pd .cat span{font-size:11px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.pd .cat[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--ontxt)}
.pd .cat[aria-pressed="true"] svg,.pd .cat[aria-pressed="true"] span{color:var(--ontxt)}
.pd .cat:disabled{opacity:.4;cursor:default}
.pd .chips{display:flex;flex-wrap:wrap;gap:6px}
.pd .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px}
.pd .chip span{opacity:.65;margin-left:5px;font-size:12px;font-variant-numeric:tabular-nums}
.pd .chip[aria-pressed="true"]{background:var(--on);color:var(--ontxt);border-color:var(--on);font-weight:700}
.pd .chips.sm .chip{font-size:12px;padding:4px 11px}
.pd .chips+.chips{margin-top:8px}
.pd .opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.pd .opt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.pd select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);max-width:240px}
.pd .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.pd .seg button{border:0;background:transparent;padding:6px 12px;font-size:13px}
.pd .seg button[aria-pressed="true"]{background:var(--on);color:var(--ontxt);font-weight:700}
.pd .sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.pd .sw i{width:30px;height:18px;border-radius:999px;background:var(--chip);position:relative;flex:none;transition:background .15s}
.pd .sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.pd .sw[aria-pressed="true"] i{background:var(--on)}
.pd .sw[aria-pressed="true"] i::after{left:14px}
.pd .reset{border:0;background:transparent;color:var(--brand);font-size:13px;font-weight:600;padding:6px 4px;margin-left:auto}
.pd .areabox{background:var(--brandbg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.pd .areabox h3{font-size:13px;margin:0 0 6px}
.pd .areabox ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 16px}
.pd .areabox li b{font-size:13px}
.pd .areabox li span{display:block;color:var(--muted);font-size:11.5px}
.pd .jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.pd .jump a{flex:1;min-width:110px;display:flex;align-items:baseline;gap:6px;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px}
.pd .jump a b{font-size:19px;font-variant-numeric:tabular-nums}
.pd .jump a.s100{border-left:4px solid var(--good)}.pd .jump a.s90{border-left:4px solid var(--mid)}.pd .jump a.sref{border-left:4px solid var(--low)}
.pd .how{color:var(--muted);font-size:12px;margin:0 0 12px}
.pd section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;scroll-margin-top:10px}
.pd section.b100{border-top:4px solid var(--good)}.pd section.b90{border-top:4px solid var(--mid)}.pd section.bref{border-top:4px solid var(--low)}.pd section.bna{border-top:4px dashed var(--low)}
.pd h2{font-size:16px;margin:0 0 2px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.pd h2 em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pd .hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.pd table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.pd th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
.pd td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pd tbody tr:nth-child(even){background:var(--zebra)}
.pd .n{text-align:right;white-space:nowrap}
.pd .name{font-weight:700;font-size:14px}
.pd .meta{color:var(--muted);font-size:12px;margin-top:3px}
.pd .tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted);white-space:nowrap}
.pd .tag.k{background:var(--brandbg);border-color:transparent;color:var(--brand);font-weight:600}
.pd .big{font-size:16px;font-weight:700}
.pd .small{color:var(--muted);font-size:12px;margin-top:2px;white-space:normal}
.pd .buy{margin-top:8px;white-space:normal;text-align:right;max-width:210px;margin-left:auto}
.pd .buy small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.pd .buyb{display:inline-flex;align-items:center;gap:4px;background:var(--on);color:var(--ontxt);text-decoration:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;line-height:1.3;text-align:left}
.pd .buyb.off{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.pd .buyn{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.pd .alt{margin-top:5px;font-size:11px;color:var(--muted)}
.pd .alt a{color:var(--brand);text-decoration:none;font-weight:600;margin-left:6px;white-space:nowrap}
.pd .alt a:hover,.pd .buyb:hover{text-decoration:underline}
.pd .shops{display:grid;grid-template-columns:minmax(110px,1fr) auto auto auto;column-gap:12px;row-gap:3px;align-items:center;min-width:340px}
.pd .shops>div{display:contents}
.pd .shops span{padding:2px 0}
.pd .shops .sn{font-size:13px}
.pd .shops .sp{text-align:right;font-weight:600}
.pd .shops .sg{text-align:right;font-size:12px}
.pd .shops .on span{background:var(--hl);font-weight:700}
.pd .shops .on .sn::before{content:"▶ ";color:var(--good)}
.pd .shops .top .sn::after{content:"最高値";font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600}
.pd .warn{font-size:10px;color:var(--ng);border:1px solid var(--ng);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600}
.pd .pill{display:inline-block;border-radius:7px;padding:1px 8px;font-weight:700;font-size:13px;min-width:58px;text-align:center}
.pd .p-good{background:var(--goodbg);color:var(--good)}.pd .p-mid{background:var(--midbg);color:var(--mid)}.pd .p-low{background:var(--lowbg);color:var(--low)}
.pd .plus{color:var(--good);font-weight:600}.pd .minus{color:var(--muted)}
.pd details{grid-column:1/-1;margin-top:2px}
.pd details>summary{cursor:pointer;color:var(--brand);font-size:12px;font-weight:600;list-style:none;padding:4px 0}
.pd details>summary::-webkit-details-marker{display:none}
.pd .memo{font-size:12px;color:var(--muted);margin-top:6px;max-width:300px}
.pd .stock-ng{color:var(--ng);font-weight:600}
.pd .empty{color:var(--muted);font-size:13px;padding:10px 0}
.pd .more{display:block;margin:10px auto 0;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 18px}
.pd mark{background:rgba(227,181,83,.35);color:inherit;border-radius:2px}
.pd .note{color:var(--muted);font-size:12px;line-height:1.7}
.pd .totop{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:0;background:var(--on);color:var(--ontxt);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:18px;display:none}
@media (max-width:760px){
 .pd .cats{grid-template-columns:repeat(3,1fr)}
 .pd .kpi b{font-size:17px}
 .pd table,.pd tbody,.pd tr,.pd td{display:block;width:100%}.pd thead{display:none}
 .pd tr{padding:12px 0;border-bottom:1px solid var(--line)}.pd tbody tr:nth-child(even){background:transparent}
 .pd td{border:0;padding:4px 0}
 .pd td.n{text-align:left;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
 .pd td.n::before{content:"仕入れ額";font-size:12px;color:var(--muted)}
 .pd .shops{min-width:0;margin-top:4px;background:var(--soft);border-radius:10px;padding:8px 10px;column-gap:8px}
 .pd .memo{max-width:none}
 .pd .buy{flex-basis:100%;text-align:left;max-width:none;margin:6px 0 0}
}

<div class="pd">
<header><div class="logo" aria-hidden="true">利</div><div><h1>仕入れ利益率ダッシュボード</h1><p id="sub"></p></div></header>

<div class="kpi" id="kpi"></div>

<div class="panel">
 <div class="step">
  <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
   <input id="q" type="text" enterkeyhint="search" placeholder="商品名・型番で検索（例: iPhone 18 Pro）" aria-label="商品名・型番で検索" autocomplete="off"><button type="button" class="x" id="qx" aria-label="検索をクリア" hidden>×</button></div>
  <div class="words" id="words"><small>よく探す商品</small></div>
 </div>
 <div class="step"><div class="st">カテゴリー</div><div class="cats" id="cats" role="group" aria-label="カテゴリー"></div>
  <div id="subwrap" hidden><div class="st" style="margin-top:12px">種類</div><div class="chips sm" id="subs" role="group" aria-label="種類"></div></div></div>
 <div class="step"><div class="st">地域 <em>選んだ地域に店頭がある買取店だけで表示（宅配買取はどこからでも可）</em></div>
  <div class="chips" id="prefs" role="group" aria-label="都道府県"></div>
  <div class="chips sm" id="spots" role="group" aria-label="エリア"></div>
  <div class="areabox" id="areabox" hidden></div></div>
 <div class="step"><div class="opts">
  <label class="opt" for="shop">買取店 <select id="shop"></select></label>
  <span class="opt">仕入れ額 <span class="seg" id="basis" role="group" aria-label="仕入れ額の見方"><button type="button" data-b="inc">ポイント差し引き</button><button type="button" data-b="ex">ポイント含めない</button></span></span>
  <button type="button" class="sw" id="plus" aria-pressed="false"><i aria-hidden="true"></i>利益が出る商品だけ</button>
  <button type="button" class="reset" id="reset">条件をリセット</button>
 </div></div>
</div>

<div class="jump" id="jump"></div>
<p class="how" id="how"></p>

<section class="b100" id="sec100"><h2>利益率100%以上 <em id="c100"></em></h2><p class="hint">買取価格が仕入れ額を上回る商品</p><div id="t100"></div></section>
<section class="b90" id="sec90"><h2>利益率90〜100% <em id="c90"></em></h2><p class="hint">ほぼ同額で回せる商品（ポイント・キャンペーン次第で利益が出る候補）</p><div id="t90"></div></section>
<section class="bna" id="secna"><h2>仕入れ額を確認できなかった商品 <em id="cna"></em></h2><p class="hint">量販店・公式ストアで販売が見つからない（販売終了・抽選のみなど）ため、利益率を出していない商品。買取価格の参考にどうぞ</p><div id="tna"></div></section>
<section class="bref" id="secref"><h2>参考（90%未満） <em id="cref"></em></h2><p class="hint">照合済みだが90%に届かない商品</p><div id="tref"></div></section>
<p class="note" id="foot"></p>
<button type="button" class="totop" id="totop" aria-label="ページの先頭へ">↑</button>

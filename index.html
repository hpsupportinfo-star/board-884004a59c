<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仕入れ利益率ダッシュボード</title>
<style>
:root{--bg:#f6f7f5;--fg:#1c1d1b;--muted:#676a64;--card:#ffffff;--line:#e1e3de;--zebra:#fafbf9;--good:#17734a;--goodbg:rgba(23,115,74,.13);--mid:#8f6400;--midbg:rgba(143,100,0,.13);--low:#7d807a;--lowbg:rgba(125,128,122,.13);--chip:#eceee9;--chipon:#1c1d1b;--chipontxt:#ffffff;--hl:rgba(23,115,74,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151614;--fg:#ecede8;--muted:#9a9d95;--card:#1f201e;--line:#33352f;--zebra:#232422;--good:#52c78f;--goodbg:rgba(82,199,143,.16);--mid:#e3b553;--midbg:rgba(227,181,83,.16);--low:#8f928b;--lowbg:rgba(143,146,139,.16);--chip:#2a2b28;--chipon:#ecede8;--chipontxt:#151614;--hl:rgba(82,199,143,.10);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
.pd{color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding:20px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto;line-height:1.5}
.pd h1{font-size:21px;margin:0 0 2px}
.pd .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.pd .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.pd .search{position:relative;margin:0 0 10px}
.pd .search input{width:100%;font:inherit;font-size:16px;padding:11px 40px 11px 40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.pd .search input:focus{outline:2px solid var(--good);outline-offset:0;border-color:transparent}
.pd .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pd .search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:6px 10px;cursor:pointer}
.pd .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pd .lbl{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
.pd .grp{display:flex;align-items:center;gap:8px}
.pd .tabs{display:flex;flex-wrap:wrap;gap:6px}
.pd .tab{font:inherit;font-size:13px;border:0;border-radius:999px;padding:6px 13px;background:var(--chip);color:var(--fg);cursor:pointer}
.pd .tab[aria-pressed="true"]{background:var(--chipon);color:var(--chipontxt);font-weight:700}
.pd .tab span{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
.pd select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);max-width:260px}
.pd .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.pd .seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--fg);padding:5px 12px;cursor:pointer}
.pd .seg button[aria-pressed="true"]{background:var(--chipon);color:var(--chipontxt);font-weight:700}
.pd button:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.pd .sum{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.pd .sum a{display:flex;align-items:baseline;gap:6px;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px}
.pd .sum a b{font-size:20px;font-variant-numeric:tabular-nums}
.pd .sum a.s100{border-left:4px solid var(--good)}.pd .sum a.s90{border-left:4px solid var(--mid)}.pd .sum a.sref{border-left:4px solid var(--low)}
.pd .how{color:var(--muted);font-size:12px;margin:0 0 12px}
.pd section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;scroll-margin-top:150px}
.pd section.b100{border-top:4px solid var(--good)}.pd section.b90{border-top:4px solid var(--mid)}.pd section.bref{border-top:4px solid var(--low)}
.pd h2{font-size:16px;margin:0 0 2px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.pd h2 em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pd .hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.pd .tbl{overflow-x:auto}
.pd table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:820px}
.pd th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
.pd td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pd tbody tr:nth-child(even){background:var(--zebra)}
.pd .n{text-align:right;white-space:nowrap}
.pd .name{font-weight:700;font-size:14px}
.pd .meta{color:var(--muted);font-size:12px;margin-top:3px}
.pd .tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted);white-space:nowrap}
.pd .big{font-size:16px;font-weight:700}
.pd .small{color:var(--muted);font-size:12px;margin-top:2px}
.pd .shops{display:grid;grid-template-columns:minmax(110px,1fr) auto auto auto;column-gap:12px;row-gap:3px;align-items:center;min-width:360px}
.pd .shops>div{display:contents}
.pd .shops span{padding:2px 0}
.pd .shops .sn{font-size:13px}
.pd .shops .sp{text-align:right;font-weight:600}
.pd .shops .sg{text-align:right;font-size:12px}
.pd .shops .on span{background:var(--hl);font-weight:700}
.pd .shops .on .sn::before{content:"▶ ";color:var(--good)}
.pd .shops .top .sn::after{content:"最高値";font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600}
.pd .pill{display:inline-block;border-radius:7px;padding:1px 8px;font-weight:700;font-size:13px;min-width:58px;text-align:center}
.pd .p-good{background:var(--goodbg);color:var(--good)}.pd .p-mid{background:var(--midbg);color:var(--mid)}.pd .p-low{background:var(--lowbg);color:var(--low)}
.pd .warn{font-size:10px;color:#b3261e;border:1px solid #b3261e;border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600}
.pd .plus{color:var(--good);font-weight:600}.pd .minus{color:var(--muted)}
.pd details{grid-column:1/-1;margin-top:2px}
.pd details>summary{cursor:pointer;color:var(--good);font-size:12px;font-weight:600;list-style:none}
.pd details>summary::-webkit-details-marker{display:none}
.pd details .shops{margin-top:4px}
.pd .memo{font-size:12px;color:var(--muted);margin-top:6px;max-width:300px}
.pd td.n .small{white-space:normal}
@media (max-width:760px){
 .pd table{min-width:0}.pd thead{display:none}
 .pd table,.pd tbody,.pd tr,.pd td{display:block;width:100%}
 .pd tr{padding:12px 0;border-bottom:1px solid var(--line)}
 .pd td{border:0;padding:4px 0}
 .pd td.n{text-align:left;display:flex;gap:8px;align-items:baseline}
 .pd td.n::before{content:"仕入れ額";font-size:12px;color:var(--muted)}
 .pd .shops{min-width:0;margin-top:4px}
 .pd .memo{max-width:none}
 .pd .bar{position:static}
}
.pd .stock-ng{color:#b3261e;font-weight:600}
.pd .empty{color:var(--muted);font-size:13px;padding:10px 0}
.pd .more{display:block;margin:10px auto 0;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 18px;cursor:pointer}
.pd mark{background:rgba(227,181,83,.35);color:inherit;border-radius:2px}
.pd .note{color:var(--muted);font-size:12px;line-height:1.7}
</style></head><body>

function band(p){return p>=100?'p-good':(p>=90?'p-mid':'p-low')}
function norm(s){s=String(s||'').normalize('NFKC').toLowerCase();ALIAS.forEach(function(a){s=s.replace(a[0],a[1])});return s.replace(/ps5|ps 5/g,'playstation 5')}
// __P: [区分, 商品名, 仕入れ先, 仕入れ先の種類, 販売価格, ポイント, 確認日, メモ, [[買取店, 買取価格], ...]]
var ALL=__P.map(function(a){return{cat:a[0]==='家電'&&/カメラ|レンズ|ミラーレス|一眼/.test(a[1])?'カメラ':a[0],name:a[1],ret:a[2],rtype:a[3],price:a[4],pts:a[5],date:a[6],note:a[7],shops:a[8],key:norm(a[1]+' '+a[2])}});
function cost(r){return ST.basis==='ex'?r.price:Math.max(1,r.price-r.pts)}
function pct(r,v){return r.price>0?v/cost(r)*100:null}
function pick(r){if(ST.shop==='すべて'){for(var j=0;j<r.shops.length;j++)if(!r.shops[j][2])return r.shops[j];return r.shops[0]}for(var i=0;i<r.shops.length;i++)if(r.shops[i][0]===ST.shop)return r.shops[i];return null}
function hit(r){if(!ST.q)return true;return norm(ST.q).split(/\s+/).filter(Boolean).every(function(w){return r.key.indexOf(w)>-1})}
function hl(node,text){
 var ws=ST.q?ST.q.normalize('NFKC').split(/\s+/).filter(Boolean):[];
 if(!ws.length){node.textContent=text;return node}
 var re=new RegExp('('+ws.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','ig');
 text.split(re).forEach(function(p,i){node.appendChild(i%2?el('mark','',p):document.createTextNode(p))});return node;
}
function shopLine(r,s){
 var d=el('div',(s[0]===ST.shop?'on':'')+(ST.shop==='すべて'&&s===pick(r)&&r.shops.length>1?' top':''));
 var sn=el('span','sn',s[0]);if(s[2])sn.appendChild(el('span','warn','要確認'));d.appendChild(sn);d.appendChild(el('span','sp',yen(s[1])));
 var p=pct(r,s[1]),a=el('span','');
 if(p!=null)a.appendChild(el('span','pill '+band(p),p.toFixed(1)+'%'));else a.textContent='—';
 d.appendChild(a);
 var g=el('span','sg');if(r.price>0){var gain=s[1]-cost(r);g.className='sg '+(gain>=0?'plus':'minus');g.textContent=(gain>=0?'+':'−')+Math.abs(Math.round(gain)).toLocaleString('ja-JP')+'円'}
 d.appendChild(g);return d;
}
function shopCell(r){
 var td=el('td'),box=el('div','shops');
 var list=r.shops.slice();
 if(ST.shop!=='すべて'){var i=list.findIndex(function(s){return s[0]===ST.shop});if(i>0)list.unshift(list.splice(i,1)[0])}
 var head=list.slice(0,4),rest=list.slice(4);
 head.forEach(function(s){box.appendChild(shopLine(r,s))});
 if(rest.length){var det=el('details'),sm=el('summary','','ほか'+rest.length+'店の価格を見る'),b2=el('div','shops');rest.forEach(function(s){b2.appendChild(shopLine(r,s))});det.appendChild(sm);det.appendChild(b2);box.appendChild(det)}
 td.appendChild(box);return td;
}
function table(rows,id){
 var t=el('table'),th=el('thead'),tr=el('tr');
 [['商品・メモ',''],['仕入れ額','n'],['買取店ごとの買取価格・利益率（高い順）','']].forEach(function(c){tr.appendChild(el('th',c[1],c[0]))});
 th.appendChild(tr);t.appendChild(th);var tb=el('tbody');
 rows.forEach(function(r){
  var x=el('tr'),a=el('td');
  a.appendChild(hl(el('div','name'),r.name));
  var m=el('div','meta');m.appendChild(el('span','tag',r.cat));m.appendChild(el('span','tag',r.rtype));m.appendChild(document.createTextNode(r.ret));a.appendChild(m);
  var e=el('div','memo');if(/販売休止|販売を終了|在庫なし/.test(r.note))e.appendChild(el('span','stock-ng',r.note));else e.textContent=r.note.replace(/^全商品照合・?/,'');
  e.appendChild(el('div','','買取店 '+r.shops.length+'店'+(r.date?'・確認日 '+r.date:'')));a.appendChild(e);x.appendChild(a);
  var c=el('td','n');
  if(r.price>0){c.appendChild(el('div','big',yen(cost(r))));c.appendChild(el('div','small',ST.basis==='ex'?(r.pts>0?'ポイント '+yen(r.pts)+' は含めず':'ポイントなし'):(r.pts>0?'販売 '+yen(r.price)+' − '+yen(r.pts)+'pt':'ポイントなし')))}
  else c.appendChild(el('div','small','定価不明'));
  x.appendChild(c);x.appendChild(shopCell(r));
  tb.appendChild(x);
 });
 t.appendChild(tb);return t;
}
function fill(id,rows){
 var box=document.getElementById(id);box.textContent='';
 if(!rows.length){box.appendChild(el('div','empty','条件に合う商品はありません'));return}
 var lim=LIMIT[id]||60;box.appendChild(table(rows.slice(0,lim),id));
 if(rows.length>lim){var b=el('button','more','残り'+(rows.length-lim)+'件を表示');b.type='button';b.onclick=function(){LIMIT[id]=lim+200;draw()};box.appendChild(b)}
}
function base(){return ALL.filter(function(r){return hit(r)&&(ST.shop==='すべて'||pick(r))})}
function draw(){
 var b=base();
 var rows=b.filter(function(r){return ST.cat==='すべて'||r.cat===ST.cat}).map(function(r){var s=pick(r);return{r:r,v:pct(r,s[1])}});
 rows.sort(function(a,c){return (c.v==null?-1:c.v)-(a.v==null?-1:a.v)});
 var g={t100:[],t90:[],tref:[]};
 rows.forEach(function(o){g[o.v!=null&&o.v>=100?'t100':(o.v!=null&&o.v>=90?'t90':'tref')].push(o.r)});
 Object.keys(g).forEach(function(k){fill(k,g[k])});
 document.getElementById('c100').textContent=g.t100.length+'件';document.getElementById('c90').textContent=g.t90.length+'件';document.getElementById('cref').textContent=g.tref.length+'件';
 var sum=document.getElementById('sum');sum.textContent='';
 [['s100','#sec100','100%以上',g.t100.length],['s90','#sec90','90〜100%',g.t90.length],['sref','#secref','90%未満',g.tref.length]].forEach(function(a){var l=el('a',a[0]);l.href=a[1];l.appendChild(el('b','',String(a[3])));l.appendChild(document.createTextNode(a[2]));sum.appendChild(l)});
 var bl=ST.basis==='ex'?'ポイントを含めない仕入れ額':'ポイントを差し引いた仕入れ額';
 document.getElementById('how').textContent=(ST.shop==='すべて'?'各商品の表の分け方は「いちばん高い買取店」の価格で判定。':'表の分け方は「'+ST.shop+'」の価格で判定。')+'利益率 ＝ 買取価格 ÷ '+bl+'。各店の価格はすべて表示しています。「要確認」は他店より極端に高く、別商品の可能性がある価格です（判定には使いません）。';
 var tabs=document.getElementById('tabs');tabs.textContent='';
 CATS.forEach(function(c){var n=b.filter(function(r){return c==='すべて'||r.cat===c}).length;if(!n&&c!=='すべて'&&c!==ST.cat)return;var t=el('button','tab',c);t.type='button';t.setAttribute('aria-pressed',c===ST.cat?'true':'false');t.appendChild(el('span','',String(n)));t.onclick=function(){ST.cat=c;LIMIT={};save();draw()};tabs.appendChild(t)});
 [].forEach.call(document.querySelectorAll('#basis button'),function(x){x.setAttribute('aria-pressed',x.getAttribute('data-b')===ST.basis?'true':'false')});
}
function shopsSelect(){
 var cnt={};ALL.forEach(function(r){r.shops.forEach(function(s){cnt[s[0]]=(cnt[s[0]]||0)+1})});
 var names=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
 if(ST.shop!=='すべて'&&!cnt[ST.shop])ST.shop='すべて';
 var sel=document.getElementById('shop');sel.textContent='';
 var o=el('option','','すべての買取店（'+names.length+'店）');o.value='すべて';sel.appendChild(o);
 names.forEach(function(n){var o=el('option','',n+'（'+cnt[n]+'件）');o.value=n;sel.appendChild(o)});
 sel.value=ST.shop;sel.onchange=function(){ST.shop=sel.value;LIMIT={};save();draw()};
}
var q=document.getElementById('q'),qx=document.getElementById('qx'),tm;
q.addEventListener('input',function(){clearTimeout(tm);qx.hidden=!q.value;tm=setTimeout(function(){ST.q=q.value.trim();LIMIT={};draw()},150)});
qx.onclick=function(){q.value='';qx.hidden=true;ST.q='';draw();q.focus()};
[].forEach.call(document.querySelectorAll('#basis button'),function(x){x.onclick=function(){ST.basis=x.getAttribute('data-b');save();draw()}});
var dates=ALL.map(function(r){return r.date}).filter(Boolean).sort();
document.getElementById('sub').textContent='買取店ごとの買取価格と、仕入れ額に対する利益率。'+(dates.length?'最新の確認日 '+dates[dates.length-1]+'。':'')+'商品 '+ALL.length+'件。';
document.getElementById('foot').textContent='※ 価格は確認時点の値です。買取価格は比較サイト「買取価格比較」と各買取店のサイト、仕入れ額は量販店・EC・メーカー直販（「定価」はメーカー定価）の表示価格です。購入前に最新の価格・在庫・購入制限を、売却前に買取店の最新価格と色・状態による減額を確認してください。毎日9時・12時・18時に自動更新します。';
shopsSelect();draw();
</script>
</body></html>
